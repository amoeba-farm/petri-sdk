[package]
name = "light_token_minter"
version = "0.2.0-mainnet.7d22fd9a"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
no-entrypoint = []
test-sbf = []
devnet-solo-backfill-2026 = []
governance-gate-v1 = []
phase3-synthetic-governance-controller = ["governance-gate-v1"]
reviewed-governance-controller = ["governance-gate-v1"]
devnet-v3-governance-controller = ["governance-gate-v1"]
mainnet-v3 = ["governance-gate-v1"]
local-ceremony-governance-controller = ["reviewed-governance-controller"]

[dependencies]
borsh = "0.10.4"
light-compressed-account = { version = "0.11.0", default-features = false, features = ["std"] }
light-compressible = { version = "0.6.0", default-features = false }
light-sdk = "=0.23.0"
light-sdk-types = { version = "=0.23.0", default-features = false, features = ["std"] }
solana-program = { version = "2.3", default-features = false }
solana-sdk-ids = "2.2.1"
thiserror = "2.0"

[dev-dependencies]
bincode = "1.3.3"
light-account = "=0.23.0"
light-client = "0.23.0"
light-event = "=0.23.1"
light-program-test = "0.23.0"
light-token = "0.23.0"
light-token-interface = "0.5.0"
proptest = "1.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
solana-nonce = "2.2.1"
solana-program-test = "2.3"
solana-sdk = "2.3"
solana-system-interface = "1.0.0"
spl-associated-token-account = { version = "7.0.0", features = ["no-entrypoint"] }
spl-token = { version = "7.0.0", features = ["no-entrypoint"] }
tokio = { version = "1.43.0", features = ["macros", "rt-multi-thread"] }

[lints.rust.unexpected_cfgs]
level = "allow"
check-cfg = ['cfg(target_os, values("solana"))']

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
incremental = false
debug = 0
strip = "debuginfo"
